apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning =
    releaseKeystorePath != null && !releaseKeystorePath.trim().isEmpty() &&
    releaseKeystorePassword != null && !releaseKeystorePassword.isEmpty() &&
    releaseKeyAlias != null && !releaseKeyAlias.trim().isEmpty() &&
    releaseKeyPassword != null && !releaseKeyPassword.isEmpty()

android {
    namespace = "org.intabtools.intabpdf"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.intabtools.intabpdf"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "2.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        compose true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.exifinterface:exifinterface:$androidxExifInterfaceVersion"

    def kotlinBom = platform("org.jetbrains.kotlin:kotlin-bom:$rootProject.ext.kotlin_version")
    implementation kotlinBom
    androidTestImplementation kotlinBom

    def composeBom = platform("androidx.compose:compose-bom:$rootProject.ext.composeBomVersion")
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation "androidx.camera:camera-core:$rootProject.ext.cameraXVersion"
    implementation "androidx.camera:camera-camera2:$rootProject.ext.cameraXVersion"
    implementation "androidx.camera:camera-lifecycle:$rootProject.ext.cameraXVersion"
    implementation "androidx.camera:camera-view:$rootProject.ext.cameraXVersion"
    implementation "org.opencv:opencv:$rootProject.ext.opencvVersion"

    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register('checkWebAssets') {
    doLast {
        def indexFile = file('src/main/assets/public/index.html')
        if (!indexFile.exists()) {
            throw new GradleException(
                "Missing web assets in src/main/assets/public/index.html. " +
                "Please run 'npm run sync:android' before building the Android project."
            )
        }
    }
}
preBuild.dependsOn checkWebAssets

tasks.register('checkReleaseSigning') {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException(
                "Missing Android release signing configuration. Set ANDROID_KEYSTORE_PATH, " +
                "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            )
        }
        if (!file(releaseKeystorePath).exists()) {
            throw new GradleException("Android release keystore file was not found at ANDROID_KEYSTORE_PATH.")
        }
    }
}

tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' || it.name == 'packageRelease' }.configureEach {
    dependsOn checkReleaseSigning
}
